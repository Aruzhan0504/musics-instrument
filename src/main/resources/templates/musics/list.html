<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Instruments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .container {
            max-width: 1200px;
        }
        .header-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .header-section h1 {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .table-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .table {
            margin-bottom: 0;
        }
        .table thead {
            background: #667eea;
            color: white;
        }
        .table tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid #e0e0e0;
        }
        .table tbody tr:hover {
            background-color: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(102, 126, 234, 0.1);
        }
        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            color: white;
        }
        .btn-edit {
            background-color: #17a2b8;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        .btn-edit:hover {
            background-color: #138496;
            transform: translateY(-2px);
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        .btn-delete:hover {
            background-color: #c82333;
            transform: translateY(-2px);
        }
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-category {
            background-color: #e7f3ff;
            color: #0066cc;
        }
        .badge-brand {
            background-color: #fff3e0;
            color: #e65100;
        }
        .price-tag {
            font-weight: 700;
            color: #667eea;
            font-size: 16px;
        }
        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .no-data-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .table td {
            vertical-align: middle;
            padding: 15px;
        }
        .table th {
            padding: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-section">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1>🎸 Music Instruments</h1>
                <p class="text-muted">Manage your collection of musical instruments</p>
            </div>
            <a href="/musicsModel/add" class="btn-add">+ Add New Instrument</a>
        </div>
    </div>

    <div class="table-section">
        <div th:if="${musics != null && musics.size() > 0}">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Model</th>
                    <th>Brand</th>
                    <th>Category</th>
                    <th>Material</th>
                    <th>Price</th>
                    <th>Country</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="music : ${musics}">
                    <td><span class="badge badge-primary" th:text="${music.id}"></span></td>
                    <td><strong th:text="${music.name}"></strong></td>
                    <td th:text="${music.model}"></td>
                    <td><span class="badge badge-brand" th:text="${music.brandId}"></span></td>
                    <td><span class="badge badge-category" th:text="${music.categoryId}"></span></td>
                    <td th:text="${music.material}"></td>
                    <td class="price-tag">$<span th:text="${#numbers.formatDecimal(music.price, 1, 2)}"></span></td>
                    <td th:text="${music.countryId}"></td>
                    <td>
                        <small th:text="${#strings.length(music.description) > 30 ? #strings.substring(music.description, 0, 30) + '...' : music.description}"
                               class="text-muted"></small>
                    </td>
                    <td>
                        <a th:href="@{/musicsModel/edit/{id}(id=${music.id})}" class="btn-edit">Edit</a>
                        <button class="btn-delete" onclick="deleteMusic([[${music.id}]])">Delete</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${musics == null || musics.size() == 0}">
            <div class="no-data">
                <div class="no-data-icon">📭</div>
                <h3>No Instruments Found</h3>
                <p>Start by adding your first musical instrument</p>
                <a href="/musicsModel/add" class="btn-add mt-3">+ Add First Instrument</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function deleteMusic(id) {
        if (confirm('Are you sure you want to delete this instrument?')) {
            fetch(`/musicsModel/${id}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            }).then(response => {
                if (response.ok) {
                    alert('Instrument deleted successfully!');
                    window.location.href = '/musicsModel';
                } else {
                    alert('Error deleting instrument');
                }
            }).catch(error => {
                console.error('Error:', error);
                alert('Error deleting instrument');
            });
        }
    }
</script>
</body>
</html>
